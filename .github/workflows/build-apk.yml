name: Build APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Download and Setup Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Prepare Build Environment
        run: |
          # إنشاء local.properties في الجذر
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # إصلاح gradle.properties لضمان دعم AndroidX
          if [ ! -f gradle.properties ]; then touch gradle.properties; fi
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Build APK
        run: |
          # البناء باستخدام Gradle 8.7 من المجلد الرئيسي
          $GITHUB_WORKSPACE/gradle-8.7/bin/gradle assembleDebug --stacktrace

      # خطوة ذكية: إذا فشل البناء، اطبع محتوى الملفات لكي نراها
      - name: Debug Information (If Failure)
        if: failure()
        run: |
          echo "=== Root build.gradle ==="
          cat build.gradle || echo "Not found"
          echo "=== settings.gradle ==="
          cat settings.gradle || echo "Not found"
          echo "=== app/build.gradle ==="
          cat app/build.gradle || echo "Not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Browser-App-Debug
          path: "**/build/outputs/apk/debug/*.apk"
