name: Build APK

# يشتغل تلقائياً عند كل رفع (push) على الفرع الرئيسي، أو يدوياً من تبويب Actions
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # نعتمد على Android SDK المثبت مسبقاً على سيرفر GitHub نفسه بدل إضافة خارجية
      - name: Accept Android SDK licenses and install required packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarSyriaBrowser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
