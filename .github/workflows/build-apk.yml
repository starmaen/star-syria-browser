name: Build APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    # استخدام نسخة ubuntu مستقرة لتجنب المشاكل
    runs-on: ubuntu-22.04
    steps:
      # 1. جلب الكود
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد جافا 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. إجبار المشروع على استخدام نسخة Gradle مستقرة (8.7)
      - name: Force stable Gradle version
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew wrapper --gradle-version 8.7
          else
            echo "Error: gradlew not found! Please ensure your repository has the Gradle wrapper files."
            exit 1
          fi

      # 4. بناء الـ APK مباشرة
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      # 5. رفع ملف الـ APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Browser-App-Debug
          path: "**/build/outputs/apk/debug/*.apk"
