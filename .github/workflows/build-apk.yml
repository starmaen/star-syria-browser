name: Build APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد جافا 17 (النسخة المستقرة والمطلوبة لأندرويد)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. إعداد الأندرويد والموافقة على الرخص تلقائياً (هذا البديل الآمن والذكي للسطر المسبب للمشكلة)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. إعطاء صلاحية التنفيذ لملف gradlew
      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # 5. بناء تطبيق الـ APK
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. رفع ملف الـ APK الناتج لتتمكن من تحميله وتجربته
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Browser-App-Debug
          path: app/build/outputs/apk/debug/*.apk
