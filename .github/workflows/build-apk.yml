name: Build APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # تجهيز بيئة الأندرويد بشكل احترافي
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # قبول الرخص
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      # إصلاح نسخة Gradle إلى 8.7
      - name: Fix Gradle Version to 8.7
        run: |
          find . -name "gradle-wrapper.properties" -exec sed -i 's/gradle-9.7.1-bin.zip/gradle-8.7-bin.zip/g' {} \;
          echo "Gradle version fixed."

      # البناء الفعلي
      - name: Build APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found, trying system gradle..."
            gradle assembleDebug --stacktrace
          fi

      # رفع الملف
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Browser-App-Debug
          path: "**/build/outputs/apk/debug/*.apk"
