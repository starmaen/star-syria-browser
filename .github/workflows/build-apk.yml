name: Build APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد جافا 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. الموافقة على رخص الأندرويد
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 4. البحث الذكي عن المشروع وبناء الـ APK
      - name: Locate Project and Build APK
        run: |
          # البحث عن ملف build.gradle لمعرفة مجلد المشروع
          build_gradle_path=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$build_gradle_path" ]; then
            echo "Error: No build.gradle file found in the repository!"
            exit 1
          fi
          
          # الانتقال إلى مجلد المشروع
          project_dir=$(dirname "$build_gradle_path")
          echo "Found Android project in: $project_dir"
          cd "$project_dir"
          
          # تشغيل البناء باستخدام gradlew المحلي أو gradle العام
          if [ -f "./gradlew" ]; then
            echo "Using local gradlew..."
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found! Using global gradle..."
            gradle assembleDebug --stacktrace
          fi

      # 5. رفع ملف الـ APK الناتج (يبحث في كل المجلدات تلقائياً)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Browser-App-Debug
          path: "**/build/outputs/apk/debug/*.apk"
