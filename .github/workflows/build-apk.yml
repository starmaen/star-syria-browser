name: Build APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK 34 and Accept Licenses
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" --licenses || true

      - name: Download and Setup Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Prepare Build Environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Build APK
        run: |
          # تشغيل البناء وتسجيل المخرجات
          $GITHUB_WORKSPACE/gradle-8.7/bin/gradle assembleDebug --stacktrace > build_log.txt 2>&1 || true
          
          # التحقق من نجاح البناء
          if grep -q "BUILD SUCCESSFUL" build_log.txt; then
            echo "======================================"
            echo "   ✅ BUILD SUCCESSFUL"
            echo "======================================"
          else
            echo "======================================"
            echo "   ❌ BUILD FAILED - EXACT ERROR:"
            echo "======================================"
            # طباعة الجزء المهم من الخطأ فقط
            grep -A 15 "What went wrong" build_log.txt || tail -n 40 build_log.txt
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Browser-App-Debug
          path: "**/build/outputs/apk/debug/*.apk"
