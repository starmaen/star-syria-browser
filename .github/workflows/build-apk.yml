name: Build APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Download and Setup Gradle 8.7
        run: |
          echo "Downloading Gradle 8.7..."
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "Gradle 8.7 is ready."

      - name: Build APK
        run: |
          # البحث عن مجلد المشروع
          BUILD_GRADLE_PATH=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$BUILD_GRADLE_PATH" ]; then
            echo "Error: No build.gradle file found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_GRADLE_PATH")
          cd "$PROJECT_DIR"
          
          # إنشاء ملف local.properties وهو السبب الرئيسي لفشل البناء في السيرفرات
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Created local.properties with SDK path: $ANDROID_HOME"
          
          # البناء
          echo "Building in directory: $(pwd)"
          $GITHUB_WORKSPACE/gradle-8.7/bin/gradle assembleDebug --stacktrace --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Browser-App-Debug
          path: "**/build/outputs/apk/debug/*.apk"
