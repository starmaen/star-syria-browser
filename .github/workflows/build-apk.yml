name: Build APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # الخطوة الأهم: إصلاح نسخة Gradle في المشروع
      - name: Fix Gradle Version to 8.7
        run: |
          find . -name "gradle-wrapper.properties" -exec sed -i 's/gradle-9.7.1-bin.zip/gradle-8.7-bin.zip/g' {} \;
          find . -name "gradle-wrapper.properties" -exec sed -i 's/gradle-9.0-bin.zip/gradle-8.7-bin.zip/g' {} \;
          echo "Gradle version has been fixed to 8.7"

      - name: Locate Project and Build APK
        run: |
          build_gradle_path=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$build_gradle_path" ]; then
            echo "Error: No build.gradle file found!"
            exit 1
          fi
          project_dir=$(dirname "$build_gradle_path")
          echo "Found Android project in: $project_dir"
          cd "$project_dir"
          
          if [ -f "./gradlew" ]; then
            echo "Using local gradlew..."
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found! Downloading Gradle 8.7..."
            wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip
            ./gradle-8.7/bin/gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Browser-App-Debug
          path: "**/build/outputs/apk/debug/*.apk"
