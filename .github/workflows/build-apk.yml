name: Build APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # تجهيز بيئة الأندرويد
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      # الخطوة الأهم: تحميل نسخة Gradle 8.7 يدوياً واستخدامها
      - name: Download and Setup Gradle 8.7
        run: |
          echo "Downloading Gradle 8.7..."
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "Gradle 8.7 is ready."

      # البناء باستخدام النسخة التي تم تحميلها
      - name: Build APK
        run: |
          cd $(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          echo "Building in directory: $(pwd)"
          ../gradle-8.7/bin/gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Browser-App-Debug
          path: "**/build/outputs/apk/debug/*.apk"
